[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xyntetik-runner-client"
version = "1.6.0"
description = "Python client and process boundary for Xyntetik Runner, the local inference engine you can prove"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["xyntetik", "llm", "local-inference", "gguf", "openai-compatible", "tool-calling", "receipts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://xyntetik.com/runner/"
Repository = "https://github.com/Joakimpalm-Zen/xyntetik-runner"
Documentation = "https://github.com/Joakimpalm-Zen/xyntetik-runner/blob/main/MANUAL.md"
Changelog = "https://github.com/Joakimpalm-Zen/xyntetik-runner/blob/main/CHANGELOG.md"
Evidence = "https://xyntetik.com/evidence/"

[project.optional-dependencies]
dev = ["mypy>=1.14,<2", "pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"xyntetik_runner" = ["py.typed"]
