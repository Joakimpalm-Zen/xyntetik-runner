name: competitor result freshness

# Published competitor rows are dated snapshots (README, docs/agent-torture.md):
# they say what was measured on a date with a named runtime version, and a
# newer upstream release does not make them wrong. So this job REPORTS drift
# and never files an issue or turns red over it. Until 2026-10-02 it opened
# "Agent-torture competitor results are stale" whenever Ollama or vLLM shipped
# a minor release, which is every few weeks: four issues (#8 to #11), each
# closed without a re-measurement, on a public tracker. Re-measurement happens
# in scheduled certification windows on owned hardware; the drift report below
# is what those windows read. The job still fails on a broken checker (exit 2:
# no published rows, or every registry lookup failed), because that is a
# defect in this repository, not news about someone else's.
on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare published rows with upstream releases
        shell: bash
        run: |
          set +e
          python3 scripts/competitor-freshness.py --json > competitor-freshness.json
          status=$?
          set -e
          cat competitor-freshness.json
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("competitor-freshness.json"))
          print("## Competitor rows against upstream releases\n")
          print("Dated snapshots: drift is information for the next "
                "certification window, not a failure.\n")
          print("| runtime | published | upstream | state |")
          print("|---|---|---|---|")
          for state in ("stale", "drift", "current"):
              for row in r[state]:
                  label = {"stale": "minor or larger behind", "drift": "patch behind",
                           "current": "current"}[state]
                  print(f"| {row['runtime']} | {row['published']} | {row['upstream']} | {label} |")
          for row in r["skipped"]:
              print(f"| {row['runtime']} | | | skipped: {row['reason']} |")
          PY
