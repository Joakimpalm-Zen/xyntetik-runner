name: ptx-reproducible

# The committed PTX headers (src/kernels_ptx.h, src/kernels_ptx80.h) are
# regenerated from source with the pinned toolchain (tools/ptx-toolchain) and
# must match byte for byte (R8.23). nvcc needs no GPU, so a hosted runner
# builds them.
on:
  pull_request:
    paths: &ptx_inputs
      - 'src/kernels*'
      - 'src/kernel_args.h'
      - 'src/tdn_args.h'
      - 'src/iq_decode.h'
      - 'src/kq_stage.h'
      - 'scripts/embed-ptx.py'
      - 'scripts/check-ptx-isa.py'
      - 'tools/ptx-toolchain/**'
      - '.github/workflows/ptx-reproducible.yml'
  push:
    branches: [main]
    paths: *ptx_inputs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ptx-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: micromamba
        run: |
          # To a file first, with retries: piped straight into tar, one failed answer from the server ended
          # the job before any PTX was built (a 500 on 2026-11-17 left main red with nothing checked), and a
          # retry could not start over once tar had read part of the stream.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 20 \
            -o "$RUNNER_TEMP/micromamba.tar.bz2" https://micro.mamba.pm/api/micromamba/linux-64/1.5.10
          tar -xjf "$RUNNER_TEMP/micromamba.tar.bz2" -C "$RUNNER_TEMP" bin/micromamba
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: make ptx with the pinned toolchain
        run: MAMBA_ROOT_PREFIX="$RUNNER_TEMP/mamba" tools/ptx-toolchain/make-ptx.sh "$RUNNER_TEMP/ptx-toolchain"
      # make ptx assembled each embedded string with the pinned ptxas
      # (scripts/check-ptx-isa.py, R6.90); here a planted used_bytes_mask
      # pragma must be caught by that ptxas as well as by the scan
      - name: the embedded PTX check catches a planted feature above its version
        run: python3 scripts/check-ptx-isa.py --self-test --ptxas "$RUNNER_TEMP/ptx-toolchain/bin/ptxas" src/kernels_ptx.h src/kernels_ptx80.h
      - name: the regenerated headers' sha256
        if: always()
        run: sha256sum src/kernels_ptx.h src/kernels_ptx80.h
      # A host without the pinned toolchain (the Windows CUDA host) writes the kernel change,
      # lets this job regenerate the headers, and commits them from the artifact:
      #   gh run download RUN_ID -n ptx-headers -D src/
      - name: the regenerated headers, as an artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ptx-headers
          path: |
            src/kernels_ptx.h
            src/kernels_ptx80.h
          if-no-files-found: error
      - name: the committed headers, byte for byte
        run: git diff --exit-code --stat src/kernels_ptx.h src/kernels_ptx80.h
