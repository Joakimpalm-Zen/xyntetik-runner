name: ci

on:
  # Runnable on demand for the complete platform suites. PRs select only
  # the Windows core gates when a relevant path changes.
  workflow_dispatch:
  schedule:
    # 04:23 UTC daily, for the jobs that are too slow to sit on a pull request
    # but whose absence is what let the Windows suite rot for nineteen days
    # (2026-08-13 to 2026-09-07, eight failures, all of them the harness).
    - cron: "23 4 * * *"
  push:
    branches: [main]
  pull_request:
  # No path filter on the workflow: a workflow that never starts leaves its
  # required checks pending and blocks the merge. The `changes` job below
  # classifies the change instead, and every engine job skips on a prose-only
  # change (site/**, docs/**, README.md, CHANGELOG.md, changes/**, except the roster
  # docs/model-tiers.json, which tests read); a skipped job satisfies
  # a required check. MANUAL.md stays in scope because help-parity reads it,
  # and SECURITY.md because it changes rarely and with code.

# Cancel superseded PR work, but keep main/scheduled certification runs.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTEST_ADDOPTS: "--durations=25 --durations-min=1 -ra"
  UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"

jobs:
  # Two questions every run asks first. (1) Did the change touch anything an
  # engine job reads? A prose-only change skips them all in seconds. (2) On a
  # push to main: was this exact tree already green on a pull request? The
  # pull-request run tests the merge of the branch into main, so a merge made
  # while main stood still produces the same tree; re-running the matrix on
  # it proved nothing and cost ten minutes before every tag (37 such runs in
  # the first twelve days of October). The pull-request run records the tree
  # it tested as an empty artifact named after the tree hash; the push run
  # looks for that artifact on a successful run of the merge's second parent.
  # PRs cover selected Windows core gates, not all platform parts. Full
  # Windows push coverage therefore ignores `tested`.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      engine: ${{ steps.classify.outputs.engine }}
      tested: ${{ steps.classify.outputs.tested }}
      gates_core: ${{ steps.classify.outputs.gates_core }}
      reverse_proxy: ${{ steps.classify.outputs.reverse_proxy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: classify the change and look for a green run of this tree
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          engine=true; tested=false; gates_core=false; reverse_proxy=false
          case "$EVENT" in
            pull_request|push)
              base=
              if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && ! printf '%s' "$BEFORE" | grep -q '^0*$' \
                 && git fetch -q --depth=1 origin "$BEFORE" 2>/dev/null; then
                base=$BEFORE
              fi
              [ -n "$base" ] || base=$(git rev-parse HEAD^1)
              changed=$(git diff --no-renames --name-only "$base" HEAD)
              gates_core=$(git diff --no-renames --name-only -z "$base" HEAD | python3 scripts/ci-gates-core.py --nul-stdin)
              reverse_proxy=$(git diff --no-renames --name-only -z "$base" HEAD | python3 scripts/ci-gates-core.py --scope reverse-proxy --nul-stdin)
              printf '%s\n' "$changed" | sed 's/^/  changed: /'
              # docs/model-tiers.json is data the tests and the site build
              # consume, not prose: a record landing there runs the engine jobs
              if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -v -E '^(site/|docs/|changes/|README\.md$|CHANGELOG\.md$)' | grep -q . \
                 && ! printf '%s\n' "$changed" | grep -qx 'docs/model-tiers.json'; then
                engine=false
              fi
              ;;
          esac
          tree=$(git rev-parse 'HEAD^{tree}')
          mkdir -p .build/tested && : > ".build/tested/$tree"
          if [ "$EVENT" = push ] && [ "$engine" = true ] && head2=$(git rev-parse -q --verify HEAD^2 2>/dev/null); then
            for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&status=success&head_sha=$head2&per_page=10" --jq '.workflow_runs[].id'); do
              if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?per_page=100" --jq '.artifacts[].name' | grep -qx "tested-tree-$tree"; then
                echo "tree $tree was green on pull-request run $id; the engine jobs skip, the full suites still run"
                tested=true; break
              fi
            done
          fi
          echo "engine=$engine gates_core=$gates_core reverse_proxy=$reverse_proxy tested=$tested tree=$tree"
          { echo "engine=$engine"; echo "gates_core=$gates_core"; echo "reverse_proxy=$reverse_proxy"; echo "tested=$tested"; echo "tree=$tree"; } >> "$GITHUB_OUTPUT"
      - name: record the tree this pull-request run tests
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: tested-tree-${{ steps.classify.outputs.tree }}
          path: .build/tested/
          retention-days: 30

  # The `make test` baseline. Deliberately boring: one Linux runner, one
  # build, one target, so that ADDING A CHECK TO `make test` IS ENOUGH TO PUT
  # IT IN CI; scripts/check-ci-roster.py refuses a root test that is wired
  # nowhere. Until 2026-10-13 a `unix` job beside this one carried some 450
  # lines of hand-written shell smokes, repeated by hand for Windows and
  # drifting from that copy; those smokes are tests now
  # (tests/test_cli_smokes.py, tests/conformance/test_server_smokes.py, the
  # torture-harness unit tests) and run wherever the suite runs. What stays a
  # step here is what `make test` cannot own: the strict client type check.
  #
  # CPU-only by construction: the runner image has no GPU, so the Metal
  # targets self-skip as macOS-only and the CUDA-linked tolerance gates report
  # "skipped: no GPU" instead of failing. Nothing here downloads a model:
  # `make test` builds its own fixtures with scripts/make-test-model.py.

  make-test:
    needs: changes
    if: needs.changes.outputs.engine == 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: pip download cache
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/**/requirements*.txt', 'python/pyproject.toml') }}
      # PEP 668: the macOS runner's Homebrew python is externally managed and
      # refuses a bare pip install, so install into a venv, and pass
      # it in as PYTHON= so every recipe in the target — fixture generation as
      # well as pytest — runs against the interpreter that has pytest. Without
      # it `make test` prints "Python client tests skipped" and passes with the
      # whole pytest half unexecuted.
      - name: install pytest and mypy
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet -r tests/ci/requirements.txt mypy
      # Separate from `make test` (which would build it as a prerequisite) so a
      # compile failure is legible as one, matching the other jobs.
      - name: build
        run: make
      - name: python client type check
        run: MYPYPATH=python/src .venv/bin/python -m mypy --strict -p xyntetik_runner
      - name: make test
        # -j: the test binaries are independent builds and the Makefile's
        # object layer makes each one a link; the recipe body (the gates
        # themselves) still runs in order inside the one `test` rule
        run: .venv/bin/python scripts/ci-run.py --timeout 2400 make-test -- make -j"$(nproc)" test PYTHON=.venv/bin/python

      - name: CI timing and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-reports-${{ github.job }}-${{ runner.os }}
          path: .build/ci/
          if-no-files-found: ignore

  # Apple Silicon on every pull request, and only what needs a Mac: the
  # build, the Metal gates of `make test` as the one named target `make
  # test-metal`, and the server conformance suite on the Metal path (the
  # gate that caught the 0.4.0 out-of-bounds read as a macOS SIGBUS while
  # Linux stayed green). Everything platform-neutral (the root pytest, the
  # client tests, the type check) runs in make-test; the hosted Mac is about
  # three times slower per test, so the whole suite runs there only in
  # macos-suite on the merge.
  #
  # Not on the push to main (R6.15, owner 2026-11-10): the pull request ran
  # this job on the merge result, so the run on main repeated it, and a
  # cancel by the hosted macOS pool left main red with nothing wrong. The
  # daily and dispatched runs still include it.
  macos:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.engine == 'true' && needs.changes.outputs.tested != 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # PEP 668: the macOS runner's Homebrew python is externally managed and
      # refuses a bare pip install, so install into a venv instead
      - name: install pytest
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet -r tests/ci/requirements.txt
      - name: build
        run: make
      - name: make test model
        run: python3 scripts/make-test-model.py test.gguf
      # the Makefile builds Apple Silicon for -mcpu=apple-m1, not the runner
      # VM's generic armv8-a: without the dot-product extension the int8
      # kernels compile out unseen (1.11.0 shipped that way). The route line
      # names the int8 prefill only where its kernel was compiled in; an SDOT
      # count cannot tell, since clang vectorizes the scalar twin with SDOT
      - name: dotprod path in the binary
        run: |
          out=$(RUNNER_CPU_I8_PREFILL=1 ./runner -m test.gguf --gpu off --score -p "hello world" 2>&1 >/dev/null) \
            || { echo "$out"; echo "the runner failed"; exit 1; }
          echo "$out"
          case "$out" in
            *'"cpu_act":"f32+int8-prefill"'*) ;;
            *) echo "no int8 prefill route: built without the dot-product extension"; exit 1 ;;
          esac
      # make test's C gates run on Linux. This one is here too because macOS treats
      # a send on a full socket differently, and only a Mac can show that (R3.36).
      - name: Socket writer (test-stream-out)
        run: make test-stream-out && ./test-stream-out
      - name: Metal gates (make test-metal)
        run: .venv/bin/python scripts/ci-run.py --timeout 1500 metal -- make test-metal PYTHON=.venv/bin/python
      # the suite's Metal pytest files, kept on every pull request now that the
      # whole suite runs on macOS only daily: these are what macos-suite-python
      # caught alone (test_metal_mv_default, 2026-10-31 and 2026-11-02)
      - name: Metal pytest files
        run: .venv/bin/python scripts/ci-run.py --timeout 1200 metal-pytest -- .venv/bin/python -m pytest -q -ra --junitxml=.build/ci/metal-pytest.xml tests/test_metal_*.py
      - name: agent-protocol conformance harness on the Metal path
        run: PYTHON=.venv/bin/python ./scripts/conformance.sh --junitxml=.build/ci/conformance.xml

      - name: CI timing and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-reports-${{ github.job }}-${{ runner.os }}
          path: .build/ci/
          if-no-files-found: ignore

  # The SIMD kernel gates at the two x86 ISA levels `make test` never names:
  # x86-64-v3, which the release binaries pin, and x86-64-v4 (AVX-512),
  # which this pool only sometimes provides. The batched f32 dot's
  # blocking-independence contract failed in `make-test` on 2026-09-02 and
  # passed on the next runner: `-march=native` compiles for whichever CPU
  # the job lands on, and GCC's tail codegen split only on some of them.
  # Building for a level by name makes each exposed configuration a
  # deliberate leg instead of pool luck. A v4 binary cannot execute without
  # AVX-512, so a host without it skips that step with a printed reason:
  # a pool property, not a failure, and the v3 step still ran. The host
  # line is printed so a failure carries the compiler and CPU it came from.

  simd-isa-levels:
    needs: changes
    if: needs.changes.outputs.engine == 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: host
        run: |
          cc --version | head -1
          grep -m1 'model name' /proc/cpuinfo || true
          echo "avx512f cores: $(grep -c avx512f /proc/cpuinfo || true)"
      - name: SIMD gates at -march=x86-64-v3 (the release pin)
        run: |
          make test-quants-simd ARCH_FLAGS=-march=x86-64-v3
          ./test-quants-simd
      - name: SIMD gates at -march=x86-64-v4
        run: |
          if [ "$(grep -c avx512f /proc/cpuinfo || true)" = "0" ]; then
            echo "skipped: this runner has no AVX-512, so an x86-64-v4 binary cannot execute here"
            exit 0
          fi
          rm -f test-quants-simd .build/quants.o
          make test-quants-simd ARCH_FLAGS=-march=x86-64-v4
          ./test-quants-simd

      - name: CI timing and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-reports-${{ github.job }}-${{ runner.os }}
          path: .build/ci/
          if-no-files-found: ignore

  # libFuzzer harnesses for the hand-written parsers that eat untrusted input.
  # Bounded by design: this is a regression gate that has to finish in a couple
  # of minutes, not a fuzzing campaign. Long soaks belong on a schedule.

  fuzz:
    name: fuzz-${{ matrix.group }}
    needs: changes
    if: needs.changes.outputs.engine == 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: parsers
            targets: json_parse schema_compile sval_feed sval_trial jsonv_feed http_request tool_stream
          - group: files
            targets: gguf_open tokenizer model_load gguf_split record_check session_read
    steps:
      - uses: actions/checkout@v7
      - name: compiler
        run: |
          command -v clang || { sudo apt-get update && sudo apt-get install -y clang llvm; }
          clang --version
      - uses: actions/cache/restore@v4
        with:
          path: fuzz-corpus/
          key: fuzz-v3-${{ matrix.group }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: fuzz-v3-${{ matrix.group }}-
      - name: build harnesses
        run: make -j2 fuzz-build FUZZ_CLANG=clang FUZZ_TARGETS="${{ matrix.targets }}"
      - name: fuzz with bounded budget
        env:
          FUZZ_BUDGET: ${{ github.event_name == 'schedule' && '300' || '30' }}
        run: python3 scripts/ci-run.py --timeout 3600 fuzz-${{ matrix.group }} -- make fuzz FUZZ_CLANG=clang FUZZ_TIME="$FUZZ_BUDGET" FUZZ_TARGETS="${{ matrix.targets }}"
      - name: minimize evolved corpora
        if: github.event_name == 'schedule'
        run: python3 scripts/fuzz-corpus.py --targets ${{ matrix.targets }}
      - name: source coverage from the evolved corpus
        if: github.event_name == 'schedule'
        run: python3 scripts/fuzz-coverage.py ${{ matrix.targets }}
      - uses: actions/cache/save@v4
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: fuzz-corpus/
          key: fuzz-v3-${{ matrix.group }}-${{ github.sha }}-${{ github.run_id }}
      - name: preserve corpora, crashes, sanitizer logs and timing
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.group }}
          path: |
            fuzz-corpus/
            .build/fuzz-coverage/
            .build/fuzz-findings/
            .build/ci/
      - name: no-op without clang
        run: |
          OUT=$(make fuzz FUZZ_CLANG=definitely-not-a-compiler)
          echo "$OUT"
          echo "$OUT" | grep -q 'skipped'

  windows:
    needs: changes
    if: needs.changes.outputs.engine == 'true' && needs.changes.outputs.tested != 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            make
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pytest
      - name: build
        run: make
      - name: reject invalid CLI values
        run: |
          for args in '--port 70000' '--gpu typo' '--kv typo' '--reserve 101'; do
            if ./runner.exe --caps $args > /dev/null 2>&1; then
              echo "unexpectedly accepted $args"; exit 1
            fi
          done
      # the loopback bind is enforced, not assumed (tests/test_bind.c, also
      # a `make test` prerequisite; the runtime half is in the conformance suite)
      - name: loopback bind invariant
        run: |
          gcc -Werror -std=gnu11 -Wall -Wextra -Wno-unused-parameter -I src tests/test_bind.c \
            -o test-bind.exe
          ./test-bind.exe
      # the tray's popup menu carries UTF-8 labels as UTF-16: read back
      # through GetMenuStringW, which only this job can call
      - name: tray menu text
        run: |
          make test-tray-win-menu.exe
          ./test-tray-win-menu.exe
      - name: make test model
        run: python3 scripts/make-test-model.py test.gguf
      # A non-ASCII prompt, file path and environment value reach the engine
      # as UTF-8: the C runtime built argv in the ANSI code page until
      # runner.exe carried its UTF-8 manifest (tests/test_utf8_io.py). The
      # same cases run against runner-no-manifest.exe, which is what an older
      # Windows runs, in this image's cp1252: they pass there through
      # compat.c's own wide reads. Only this job runs them on Windows for a
      # pull request; --no-skips because a skipped case here is the
      # regression going unseen.
      - name: UTF-8 at the process boundary
        env:
          PYTHONUTF8: "1"
        run: |
          make runner-no-manifest.exe
          python3 -m pytest -q tests/test_utf8_io.py --junitxml=.build/ci/utf8-io.xml
          python3 scripts/check-junit.py --no-skips .build/ci/utf8-io.xml
      - name: offline cache inventory
        run: |
          python3 -m pytest -q tests/test_cached.py -k "not symlinks and not read_errors" --junitxml=.build/ci/cached.xml
          python3 scripts/check-junit.py --no-skips .build/ci/cached.xml
      # the console's output code page: UTF-8 while a console is on stdout or
      # stderr, untouched when both are redirected, restored at exit
      - name: UTF-8 console code page
        run: |
          make test-utf8-console.exe
          ./test-utf8-console.exe
      - name: python client tests
        # UTF-8 regardless of the runner's locale: the shadow fixtures carry
        # non-ASCII text and a cp1252 default turns them into a SyntaxError
        env:
          PYTHONUTF8: "1"
        run: PYTHONPATH=python/src python3 -m pytest python/tests/
      # The server suite on Windows, on every pull request: until 2026-10-13
      # the only Windows server coverage was a hand-copied list of curl smokes
      # that had drifted from the unix one. The whole engine suite (`make
      # test`) is too slow for the pull-request path and runs in windows-suite
      # on the merge.
      - name: agent-protocol conformance harness
        env:
          PYTHONUTF8: "1"
        run: PYTHON=python3 ./scripts/conformance.sh --junitxml=.build/ci/conformance.xml
      - name: smoke test (server, backslash model path)
        # regression: a C:\...\model.gguf -m path used to land unescaped in the
        # response's "model" field, making every completion body invalid JSON
        # The step is bounded: on 2026-11-04 it sat for 50 minutes on a hosted
        # runner (the job's 45-minute limit cancelled it and kept no log), where
        # the whole job takes five; a hang now fails in five with its log, and
        # /health answers at once, so its poll is bounded by seconds, not 90.
        timeout-minutes: 5
        run: |
          trap 'pids=$(jobs -pr); if [ -n "$pids" ]; then kill $pids 2>/dev/null || true; sleep 1; kill -KILL $pids 2>/dev/null || true; wait $pids 2>/dev/null || true; fi' EXIT
          ./runner.exe -m "$(cygpath -w "$PWD")\\test.gguf" --serve --port 8125 &
          for i in $(seq 60); do curl --connect-timeout 5 --max-time 10 -sf -o /dev/null http://127.0.0.1:8125/health && break; sleep 0.5; done
          curl --connect-timeout 5 --max-time 90 -sf -d '{"messages":[{"role":"user","content":"hi"}],"max_tokens":4,"temperature":0}' \
            http://127.0.0.1:8125/v1/chat/completions | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['model'] == 'test.gguf', d['model']; print('windows path model field ok')"
          kill %1
      - name: smoke test (parent-pid watch)
        # the runner must exit when the process named by --parent-pid dies;
        # tests/test_parent_pid.py pins this everywhere but Windows, so the
        # shell form stays here only
        timeout-minutes: 5
        run: |
          # the parent proves the server is up before it dies (a runner that
          # never served proves nothing), then the shell polls for it to go
          # away within 20 s; one fixed 6 s wait failed twice on 2026-10-08
          # on the Windows pool
          python3 - <<'PYEOF'
          import os, subprocess, sys, time, urllib.request
          exe = "./runner.exe" if os.name == "nt" else "./runner"
          p = subprocess.Popen([exe, "-m", "test.gguf", "--serve", "--port", "8127",
                                "--parent-pid", str(os.getpid())])
          for i in range(40):
              if p.poll() is not None: sys.exit("runner died early")
              try:
                  urllib.request.urlopen("http://127.0.0.1:8127/health", timeout=2).read()
                  break
              except OSError:
                  time.sleep(0.5)
          else:
              sys.exit("runner never answered /health")
          os._exit(0)  # abrupt parent death, no cleanup
          PYEOF
          for i in $(seq 40); do
            if ! curl --connect-timeout 2 --max-time 5 -s -o /dev/null http://127.0.0.1:8127/health; then
              echo "parent-pid ok (runner gone after $i polls)"; exit 0
            fi
            sleep 0.5
          done
          echo "runner survived parent death for 20 s"; exit 1

      - name: CI timing and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-reports-${{ github.job }}-${{ runner.os }}
          path: .build/ci/
          if-no-files-found: ignore

  # Phase 0 agent-protocol conformance harness. Runs against the synthetic
  # test.gguf so it needs no model download and no GPU. Locally: scripts/conformance.sh

  conformance:
    needs: changes
    if: needs.changes.outputs.engine == 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: pip download cache
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/**/requirements*.txt', 'python/pyproject.toml') }}
      - name: build
        run: make
      - name: make test model
        run: python3 scripts/make-test-model.py test.gguf
      - name: install pytest
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet -r tests/ci/requirements.txt
      - name: agent-protocol conformance harness
        run: PYTHON=.venv/bin/python ./scripts/conformance.sh --junitxml=.build/ci/conformance.xml
      - name: conformance report
        if: always()
        run: |
          test -f tests/conformance/out/report.json
          python3 -c "
          import json
          d = json.load(open('tests/conformance/out/report.json'))
          print(json.dumps(d['totals'], indent=2))
          print(json.dumps(d['latency_ms'], indent=2))
          print('peak_rss_kb', d['resources'])
          for n in d['model_quality_notes']: print('quality:', n['test'], '-', n['message'])
          "
      # The agent torture matrix against Runner itself: schema enforcement makes
      # even the tiny test fixture pass every adversarial case, so ANY failure
      # is a Runner conformance regression, not a weak model. Standing guard on
      # the exact claim the cross-runtime leaderboard makes.
      - name: agent torture (self-conformance)
        run: |
          python3 scripts/agent-torture.py --cases 40 --out tests/torture/out
          python3 -c "
          import json, sys
          d = json.load(open('tests/torture/out/report.json'))
          t = d['totals']
          print('agent-torture', json.dumps(t))
          sys.exit(1 if t['failed'] else 0)
          "
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conformance-report
          path: |
            tests/conformance/out/
            tests/torture/out/

      - name: CI timing and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-reports-${{ github.job }}-${{ runner.os }}
          path: .build/ci/
          if-no-files-found: ignore

  # The same conformance suite against the ASan+UBSan binary (make debug).
  # The plain-build suite cannot be trusted to surface undefined behavior:
  # the v0.4.0 release gate caught an out-of-bounds read that SIGBUSed the
  # -O3 server on macOS while this Ubuntu suite stayed green on benign
  # garbage — under UBSan the same read is flagged on any platform, and
  # -fno-sanitize-recover turns it into a dead server the suite cannot miss.
  # Scope, stated plainly: this leg gates UB and memory corruption on the
  # API surface. Leak detection is off (the harness kills servers, so exit
  # paths may be forcibly terminated). CLI transformations run in their own
  # fully instrumented lane; no optimized quantization object is linked.

  conformance-sanitized:
    needs: changes
    if: needs.changes.outputs.engine == 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: pip download cache
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/**/requirements*.txt', 'python/pyproject.toml') }}
      - name: build sanitized runner
        run: make debug
      - name: make test model
        run: python3 scripts/make-test-model.py test.gguf
      - name: install pytest
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet -r tests/ci/requirements.txt
      - name: agent-protocol conformance harness (sanitized)
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          RUNNER_EXE: ./runner-debug
          RUNNER_CONFORMANCE_OUT: tests/conformance/out-sanitized
        run: PYTHON=.venv/bin/python ./scripts/conformance.sh --junitxml=.build/ci/conformance.xml
      - name: sanitizer instrumentation negative controls
        run: python3 scripts/check-sanitizers.py
      - name: sanitized sharing and load cleanup
        run: make test-shared-asan
      - name: CLI leak gate
        # The GPU smokes keep leak detection off because a loaded driver owns
        # process-lifetime allocations; the CPU path has no such noise and is
        # the leak gate for CLI-owned model/tokenizer/engine state. gemma4 and
        # muse-glimmer rebuild the sliding-window layer table the generic
        # loader already built, and until 2026-09-30 stranded the first copy
        # on every load; test.gguf has no sliding window, so it cannot see it.
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: |
          python3 scripts/make-test-model.py --muse-glimmer test-leak-muse.gguf
          python3 scripts/make-test-model.py --gemma4-hetero test-leak-g4h.gguf
          # R6.68.23: a recurrent block of a qwen35 file with experts bound
          # its two norm buffers twice and leaked the first pair on every
          # load (the qwen35moe toy shows it; the qwen4exp fixture has no such
          # norms and is here as a guard), and a LayerNorm family's norm
          # biases were released nowhere
          ORNITH_TEST_MOE=1 python3 scripts/make-test-ornith.py test-leak-q35moe.gguf
          python3 scripts/make-test-qwen4exp.py test-leak-q4x.gguf
          python3 scripts/make-test-model.py --arch stablelm test-leak-stablelm.gguf
          for f in test.gguf test-leak-muse.gguf test-leak-g4h.gguf test-leak-q35moe.gguf \
                   test-leak-q4x.gguf test-leak-stablelm.gguf; do
            ./runner-debug -m "$f" -p "hello" -n 8 --temp 0 --gpu off
          done
          # R6.68.38: a constrained run that writes a session image ends with
          # the engine's constraint document buffer allocated; no teardown
          # freed it (the history beside it was freed by hand)
          ./runner-debug -m test.gguf -p "hello" -n 12 --temp 0.8 -s 3 --json --gpu off \
            --session-out test-leak-session.img
          # R6.68.41: a resume refused after its image is read (here: the image
          # was written under a schema and none is given) returned with the
          # image allocated; exit 1 is the refusal, 23 a leak report
          ./runner-debug -m test.gguf -p "hello" -n 12 --temp 0 --gpu off \
            --json-schema tests/fixtures/leak-gate-schema.json --session-out test-leak-schema.img
          rc=0; ./runner-debug -m test.gguf --resume test-leak-schema.img --gpu off || rc=$?
          test "$rc" = 1 || { echo "a refused resume exited $rc, not 1 (a leak report exits 23)"; exit 1; }
          # R6.68.39: a server start refused before the serving loop (here the
          # port is taken) returned with the loaded model and tokenizer still
          # allocated, on about twenty refusals. Exit 1 is the refusal; a
          # LeakSanitizer report would exit 23.
          python3 - <<'PY'
          import socket, subprocess, sys
          s = socket.socket()
          s.bind(("127.0.0.1", 0))
          s.listen(1)
          port = str(s.getsockname()[1])
          for extra in ([], ["--parallel", "2"]):
              rc = subprocess.run(["./runner-debug", "-m", "test.gguf", "--serve", "--port", port,
                                   "--gpu", "off", *extra]).returncode
              if rc != 1:
                  sys.exit("a refused server start exited %d, not 1 (a leak report exits 23)" % rc)
          PY
      - name: sanitized server race gate
        # /v1/capabilities is answered on the accept loop while another client
        # swaps the model out from under it; the conformance suite above never
        # runs the accept thread against a slot thread under a sanitizer.
        run: make test-swap-race
      - name: CLI lifecycle and transformations under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
          RUNNER_TEST_GPU_OFF: "1"
        run: |
          cp runner-debug runner
          make test-moe-train.moe4-train.gguf test-lora.full.gguf PYTHON=.venv/bin/python
          .venv/bin/python scripts/ci-run.py --timeout 1800 sanitized-cli -- \
            .venv/bin/python -m pytest -q --junitxml=.build/ci/sanitized-cli.xml \
            tests/test_cli_files.py tests/test_lineage.py tests/test_eval_record.py \
            tests/test_moe_lora.py tests/test_merge.py tests/test_cached.py
          .venv/bin/python scripts/check-junit.py --no-skips .build/ci/sanitized-cli.xml
      - name: hostile geometry and the valid fixtures under sanitizers
        # tests/test_hostile_geometry.py holds nine cases that need the
        # sanitized binary and skip without a fresh one. `make test` does not
        # build it and this job, which does, did not name the file, so they
        # ran nowhere (R6.68.16). test-g4h.gguf is generated only by the Metal
        # recipe, so it is made here by hand; no skip is allowed.
        env:
          RUNNER_TEST_GPU_OFF: "1"
        run: |
          .venv/bin/python scripts/make-test-moe.py test-moe-fixture > /dev/null
          .venv/bin/python scripts/make-test-model.py --gemma4-hetero test-g4h.gguf
          make test-es.gguf PYTHON=.venv/bin/python
          .venv/bin/python scripts/ci-run.py --timeout 900 sanitized-geometry -- \
            .venv/bin/python -m pytest -q -rs --junitxml=.build/ci/sanitized-geometry.xml \
            tests/test_hostile_geometry.py
          .venv/bin/python scripts/check-junit.py --no-skips .build/ci/sanitized-geometry.xml
      - name: conformance report
        if: always()
        run: |
          test -f tests/conformance/out-sanitized/report.json
          python3 -c "
          import json
          d = json.load(open('tests/conformance/out-sanitized/report.json'))
          print(json.dumps(d['totals'], indent=2))
          "
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conformance-sanitized-report
          path: tests/conformance/out-sanitized/

      - name: CI timing and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-reports-${{ github.job }}-${{ runner.os }}
          path: .build/ci/
          if-no-files-found: ignore

  # Real SDK/gateway/framework parsers catch integration assumptions that raw
  # JSON fixtures cannot. Dependencies are pinned and isolated from Runner.

  consumer-compatibility:
    needs: changes
    if: needs.changes.outputs.engine == 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: pip download cache
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/**/requirements*.txt', 'python/pyproject.toml') }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/compatibility/node/package-lock.json
      - name: build and make test model
        run: |
          make
          python3 scripts/make-test-model.py test.gguf
      - name: install pinned consumers
        run: |
          python3 -m venv .compat-venv
          .compat-venv/bin/pip install --quiet -r tests/compatibility/requirements.txt
          npm ci --ignore-scripts --prefix tests/compatibility/node
      - name: official SDK, LiteLLM and LangChain compatibility
        run: .compat-venv/bin/python scripts/consumer_compat.py
      - name: install Vercel AI SDK conformance dependencies
        run: |
          npm install --ignore-scripts --prefix tests/aisdk
          mkdir -p .build/ci
          npm list --all --json --prefix tests/aisdk > .build/ci/vercel-dependencies.json
          .compat-venv/bin/pip freeze > .build/ci/python-consumer-dependencies.txt
      - name: SDK protocol conformance (required, no skips)
        run: |
          RUNNER_CONFORMANCE_OUT=.build/sdk-conformance .compat-venv/bin/python -m pytest -q \
            tests/conformance/test_openai_sdk.py tests/conformance/test_messages.py \
            tests/conformance/test_ai_sdk.py --junitxml=.build/ci/sdk.xml
          .compat-venv/bin/python scripts/check-junit.py --no-skips .build/ci/sdk.xml
      - name: TypeScript client (clients/typescript)
        run: make test-ts-client
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: consumer-compatibility-report
          path: tests/compatibility/out/consumers.json

      - name: CI timing and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-reports-${{ github.job }}-${{ runner.os }}
          path: .build/ci/
          if-no-files-found: ignore

  # Chat-template conformance: runner renders chat templates natively in C, so
  # the ONLY thing standing between a family and silent drift is a comparison
  # against the model's own jinja template. `make test` builds and runs
  # tests/test_template.c, but that gate cannot find drift: its goldens
  # were written from runner's own output, so it proves self-consistency and
  # nothing else. That is precisely how 30 real differences accumulated across
  # 8 families unnoticed. This job is the oracle.
  #
  # It gets its own job rather than a step in make-test, for two reasons:
  #   - it is the one gate here that talks to a third party (huggingface.co).
  #     Isolated, a red here is unambiguous and does not tar the build matrix.
  #   - it reports three outcomes, not two: exit 2 means NOT CHECKED (oracle
  #     unreachable), never "conformant". Read the summary line before
  #     assuming a red is drift. The fetch already retries 3x on transport
  #     errors, so a red is more likely real than not.
  #
  # --network-only restricts it to the families whose reference is fetched
  # over HTTP. gemma/gemma4/granite/harmony read their template out of a
  # multi-GB local GGUF and are simply not checkable on a CI runner; asking
  # for them would guarantee a permanent exit 2. Those four are covered by
  # `make template-conformance` on a dev box with models/, and their backlog
  # stays recorded in scripts/template-conformance-baseline.json either way.

  template-conformance:
    needs: changes
    if: needs.changes.outputs.engine == 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: pip download cache
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/**/requirements*.txt', 'python/pyproject.toml') }}
      - name: install jinja2
        # jinja2 renders the REFERENCE side. Without it nothing is compared,
        # and the harness says so (exit 2) instead of passing.
        run: |
          python3 -m venv .tmpl-venv
          .tmpl-venv/bin/python -m pip install --quiet jinja2
      - name: runner C renderer vs upstream jinja templates
        run: .tmpl-venv/bin/python scripts/template-conformance.py --network-only
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: template-oracles
          path: .build/template-oracles/

      - name: CI timing and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-reports-${{ github.job }}-${{ runner.os }}
          path: .build/ci/
          if-no-files-found: ignore

  # The tests whose expected values come from outside this repository: gold
  # logits against the publisher's float32 forward in torch, the activation
  # trace against transformers, the DeltaNet backward against autograd, and
  # the KLD and lookup-draft cases that need a real model file; and beside
  # them the tokenizer diff against Hugging Face tokenizers, the receipt
  # signature checked by an independent Ed25519 (cryptography) and the
  # sigstore model-signing round trip. They skip on "could not import torch",
  # "not present" or "not installed" wherever those are missing, which until
  # R6.68.11 was every job here and the release gate too: tests that no
  # change ever ran. This job provides all of it and allows no skip.
  # The model is the 145 MB SmolLM2-135M-Instruct Q8_0, fetched by its pinned
  # sha256 (download-model.sh) behind a cache, so huggingface.co is asked once
  # per cache lifetime, not once per run.
  anchors:
    needs: changes
    if: needs.changes.outputs.engine == 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: pip download cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-anchors-${{ runner.os }}-${{ runner.arch }}-v1
      - name: model file cache
        uses: actions/cache@v4
        with:
          path: models/SmolLM2-135M-Instruct-Q8_0.gguf
          key: model-smollm2-135m-instruct-q8_0-5a1395716f79
      - name: install torch (CPU), transformers and the other optional packages
        run: |
          python3 -m venv .anchor-venv
          .anchor-venv/bin/python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch
          .anchor-venv/bin/python -m pip install --quiet pytest numpy transformers accelerate safetensors \
            tokenizers cryptography model-signing pyopenssl
      - name: anchored tests, no skip allowed
        run: python3 scripts/ci-run.py --timeout 1800 anchors -- make -j2 test-anchors PYTHON=.anchor-venv/bin/python
      - name: CI timing and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-reports-${{ github.job }}-${{ runner.os }}
          path: .build/ci/
          if-no-files-found: ignore

  # The whole suite on Windows, which the per-pull-request `windows` job above
  # does NOT run: that job is the build, the platform-only steps and the
  # server conformance suite. Five test files the old hand-picked smoke list
  # had never named accumulated Windows-only defects (os.pread, Unix-only mmap
  # arguments, os.killpg, a CRLF hash, an env replacement that dropped
  # SystemRoot) and nothing could see them, because the only machine that runs
  # this suite on Windows was a desk in the lab.
  #
  # Relevant PRs run gates-core before merge (R6.29). The other Windows
  # parts stay on engine pushes, schedule and dispatch, preserving the fast
  # PR path. No GPU here, so device-only gates self-skip.

  # The full Windows suite, the same three parts as macos-suite.
  windows-suite:
    name: windows-suite-${{ matrix.part }}
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.changes.outputs.engine == 'true') || (github.event_name == 'pull_request' && needs.changes.outputs.gates_core == 'true')
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(github.event_name == 'pull_request' && '["gates-core"]' || '["gates-core","gates-batch","python"]') }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            make
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pytest
            mingw-w64-ucrt-x86_64-python-pytest-xdist
      - name: make test-${{ matrix.part }}
        env:
          PYTHONUTF8: "1"
        run: python3 scripts/ci-run.py --timeout 3300 windows-suite-${{ matrix.part }} -- make -j2 test-${{ matrix.part }} PYTEST_WORKERS=auto
      - name: CI timing and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-reports-${{ github.job }}-${{ matrix.part }}-${{ runner.os }}
          path: .build/ci/
          if-no-files-found: ignore


  reverse-proxy:
    needs: changes
    if: needs.changes.outputs.reverse_proxy == 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: build fixture server
        run: make -j2 runner
      - name: verify the shipped TLS and API-key Compose recipe
        run: python3 scripts/ci-run.py --timeout 300 reverse-proxy -- python3 scripts/test-reverse-proxy.py --runner ./runner
      - name: proxy test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reverse-proxy-report
          path: .build/ci/

  thread-sanitizer:
    needs: changes
    if: needs.changes.outputs.engine == 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: shared pool, registry/shutdown and tokenizer races
        # every --parallel slot tokenizes with the one tokenizer the server
        # loaded; per-call state left in it was a data race (2026-09-30)
        run: python3 scripts/ci-run.py --timeout 1200 thread-sanitizer -- make test-pool-race test-server-race-tsan test-tokenizer-race test-decide-race
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: thread-sanitizer-report
          path: .build/ci/

  t3:
    needs: changes
    if: needs.changes.outputs.engine == 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: build actual T3 binary and fixture
        run: |
          make T3=1 test.gguf runner test-q8.gguf test-q4k.gguf test-bf16.gguf
          ./runner --version | grep -F "(t3)"
      - name: install pytest
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r tests/ci/requirements.txt
      - name: deterministic generation, training and replay
        run: |
          # the CUDA-only cases (test_cuda_*, the GPU training pair) run in the
          # CUDA gate (make test-cuda-gated); a hosted runner has no device and
          # --no-skips would fail on them (tests/test_ci_contracts.py checks)
          .venv/bin/python scripts/ci-run.py --timeout 1500 t3 -- .venv/bin/python -m pytest -q \
            tests/test_transcript.py tests/test_train.py tests/test_session_images.py tests/test_canon_gaps.py \
            -k "not gpu_training_matches_cpu_bytes and not test_cuda_ and not train_gpu_matches_cpu_within_rounding and not train_gpu_budget_decides" \
            --junitxml=.build/ci/t3.xml
          .venv/bin/python scripts/check-junit.py --no-skips .build/ci/t3.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: t3-report
          path: .build/ci/

  # The whole suite on hosted Apple Silicon, same policy as windows-suite.
  # The hosted image trails the lab Macs by a macOS release, so a gate that
  # needs the newest Metal toolchain must skip with a reason here, as
  # tests/test_metal_tensor.m does, rather than fail a lane nobody reads.
  # The full macOS suite as three parallel jobs (R6.13 step 2): the C gates,
  # the batch gates and the python target, the three parts of `make test`.
  # The python part runs the root pytest under pytest-xdist, one worker per
  # core, whole files per worker.
  macos-suite:
    name: macos-suite-${{ matrix.part }}
    needs: changes
    # Daily and on dispatch, not on every push: GitHub's hosted macOS arm64
    # pool is capacity-limited ("jobs targeting macOS arm64 runners may
    # experience longer queue times"; a job "not acquired by Runner of type
    # hosted even after multiple attempts" is cancelled), and four macOS jobs
    # a push kept main red for hours on 2026-11-04. The `macos` job above
    # keeps the Metal gates and the Metal pytest files on every pull request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [gates-core, gates-batch, python]
    steps:
      - uses: actions/checkout@v7
      - name: install pytest
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r tests/ci/requirements.txt
      - name: make test-${{ matrix.part }}
        run: .venv/bin/python scripts/ci-run.py --timeout 3300 macos-suite-${{ matrix.part }} -- make -j3 test-${{ matrix.part }} PYTHON=.venv/bin/python PYTEST_WORKERS=auto
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-suite-report-${{ matrix.part }}
          path: .build/ci/

  # The one check branch protection requires for the engine matrix. A job
  # that is skipped (docs-only change, or a tree a pull request already
  # tested) still lets this pass; a job that failed or was cancelled fails
  # it. Requiring the matrix jobs themselves does not work: a skipped
  # matrix job reports under its unexpanded name ("fuzz-${{ matrix.group }}"),
  # so the required fuzz-parsers and fuzz-files checks never appear and a
  # docs-only pull request can never merge.
  pr-gate:
    name: pr-gate
    needs: [changes, make-test, macos, simd-isa-levels, fuzz, windows, conformance,
            conformance-sanitized, consumer-compatibility, template-conformance,
            anchors, thread-sanitizer, t3, windows-suite, reverse-proxy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every needed job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          bad = {k: v["result"] for k, v in needs.items() if v["result"] not in ("success", "skipped")}
          for k, v in sorted(needs.items()):
              print(f"{k:24s} {v['result']}")
          if bad:
              print("blocked by:", bad); sys.exit(1)
          PY
