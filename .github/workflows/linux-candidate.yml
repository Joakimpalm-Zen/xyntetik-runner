name: Linux compatibility candidate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: ELF gate tests
        run: |
          python3 -m venv /tmp/abi-tests
          /tmp/abi-tests/bin/pip install pytest
          /tmp/abi-tests/bin/python -m pytest -q tests/test_glibc_release.py
      - name: Build with release flags
        run: |
          make -j2 CC=gcc CFLAGS="-O3 -ffast-math -std=gnu11 -Wall -Wextra -Wno-unused-parameter -march=x86-64-v3"
          python3 scripts/check-glibc.py ./runner --max-version 2.38
          test "$(./runner --version)" = "runner $(sed -n 's/^#define RUNNER_VERSION "\([^"]*\)"/\1/p' src/runner.h)"
      - name: Package candidate and verify SHA256SUMS
        run: |
          mkdir candidate
          cp runner candidate/runner-linux-x86_64
          {
            ./runner --version
            echo "candidate:  not published"
            echo "commit:     $(git rev-parse HEAD)"
            echo "runner-os:  ubuntu-24.04"
            echo "image:      $ImageOS $ImageVersion"
            echo "compiler:   $(gcc --version | head -1)"
            echo "libc:       $(getconf GNU_LIBC_VERSION)"
            echo "cflags:     -O3 -ffast-math -std=gnu11 -Wall -Wextra -Wno-unused-parameter -march=x86-64-v3"
            python3 scripts/check-glibc.py ./runner --max-version 2.38
          } > candidate/BUILD-INFO.txt
          tar --exclude=__pycache__ -czf candidate/runner-linux-x86_64.tar.gz -C candidate runner-linux-x86_64 BUILD-INFO.txt -C "$PWD" README.md MANUAL.md LICENSE python/src python/README.md python/pyproject.toml
          (cd candidate && sha256sum runner-linux-x86_64 runner-linux-x86_64.tar.gz > SHA256SUMS && sha256sum -c SHA256SUMS)
          mkdir unpacked
          tar -xzf candidate/runner-linux-x86_64.tar.gz -C unpacked
          cmp candidate/runner-linux-x86_64 unpacked/runner-linux-x86_64
          python3 scripts/check-glibc.py unpacked/runner-linux-x86_64 --max-version 2.38
      - name: Ubuntu 24.04 startup and fixture inference
        run: |
          python3 scripts/make-test-model.py test.gguf
          unpacked/runner-linux-x86_64 --version | tee candidate/startup-ubuntu2404.txt
          unpacked/runner-linux-x86_64 -m test.gguf -p hello -n 8 --temp 0 --gpu off > candidate/fixture-ubuntu2404.txt 2> candidate/fixture-ubuntu2404.stderr
          test -s candidate/fixture-ubuntu2404.txt
      - name: GLIBC 2.38 startup and fixture inference
        run: |
          curl --fail --location --retry 3 -o libc6_2.38-1ubuntu6.3_amd64.deb https://old-releases.ubuntu.com/ubuntu/pool/main/g/glibc/libc6_2.38-1ubuntu6.3_amd64.deb
          echo 'f29a9f1b26a2990310b78bb18767c287effe4d9f785a3b98e1efe425242dd4ca  libc6_2.38-1ubuntu6.3_amd64.deb' | sha256sum -c -
          dpkg-deb -x libc6_2.38-1ubuntu6.3_amd64.deb glibc238
          loader=$(find "$PWD/glibc238" -type f -name ld-linux-x86-64.so.2 -print -quit)
          test -n "$loader"
          libdir=$(dirname "$loader")
          "$loader" --library-path "$libdir" unpacked/runner-linux-x86_64 --version | tee candidate/startup-glibc238.txt
          "$loader" --library-path "$libdir" unpacked/runner-linux-x86_64 -m test.gguf -p hello -n 8 --temp 0 --gpu off > candidate/fixture-glibc238.txt 2> candidate/fixture-glibc238.stderr
          cmp candidate/fixture-ubuntu2404.txt candidate/fixture-glibc238.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-compatibility-candidate
          path: candidate/
          if-no-files-found: error
