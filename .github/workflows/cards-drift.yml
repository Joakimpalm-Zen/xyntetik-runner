name: cards-drift

# Each published model file's Hugging Face card carries a "last validated"
# block rendered from docs/model-tiers.json (scripts/model-tiers.py --cards,
# docs/model-support.md#cards-and-site). This job asks the Hub whether every
# card's block is still the roster's render. Pushing the cards is an explicit
# step with a token, taken after the merge that changed the render, so a pull
# request would always see drift: the job runs on main and weekly, never on a
# pull request, and is not a required check. Drift or a refused card (exit 1)
# fails it; a Hub that cannot be read (exit 3: a timeout, a dropped
# connection, a busy server) is a warning, because an outage says nothing
# about the cards. Reading public cards needs no token and none is used.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cards-drift-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  cards-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Compare each card's block with the roster's render
        shell: bash
        run: |
          set +e
          python3 scripts/model-tiers.py --cards-check
          status=$?
          set -e
          if [ "$status" -eq 3 ]; then
            echo "::warning title=cards-drift::the Hugging Face Hub could not be read; a network failure, not drift"
            exit 0
          fi
          exit "$status"
